name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb1-dev libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libwayland-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - run: cargo test --release
      - uses: actions/upload-artifact@v4
        with:
          name: lintas-x86_64-linux
          path: target/release/lintas

  # The "tray" and "gui" features are optional (see Cargo.toml) — this keeps
  # the headless-CLI build path (no GUI toolkit, no D-Bus stack) actually
  # compiling and passing clippy, instead of silently bitrotting.
  build-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --no-default-features -- -D warnings
      - run: cargo build --release --no-default-features
      - run: test $(stat -c%s target/release/lintas) -lt 8000000

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lintas-x86_64-linux
      - run: |
          chmod +x lintas
          mkdir -p target/release
          cp lintas target/release/lintas
          tar czf lintas-x86_64-linux.tar.gz lintas packaging README.md LICENSE
      - name: Install AppImage runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon0 libx11-6 libxcursor1 libxi6 libxrandr2 libxcb1 \
            libgl1 libfontconfig1 libfreetype6 libwayland-client0
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash packaging/build-appimage.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            lintas-x86_64-linux.tar.gz
            lintas-*.AppImage
